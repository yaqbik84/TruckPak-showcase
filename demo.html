<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="TruckPak — pełnoekranowe interaktywne demo Android." />
  <title>TruckPak — demo Android</title>
  <style>
    :root{--bg:#0b1020;--text:#f6f8fb;--muted:#aeb8cc;--accent:#54d08a;--border:rgba(255,255,255,.1)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    body{min-height:100dvh;display:flex;flex-direction:column}
    header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border);background:rgba(11,16,32,.96)}
    .brand{font-weight:800}.brand span{color:var(--accent)}
    a{color:var(--muted);text-decoration:none;font-size:14px}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:14px}
    .frame{width:min(430px,100%);height:min(840px,calc(100dvh - 86px));min-height:620px;display:flex;align-items:center;justify-content:center}
    iframe{display:block;width:100%;height:100%;border:0;background:#050810}
    @media(max-width:520px){header{padding:0 12px}.frame{width:100%;height:calc(100dvh - 76px);min-height:560px}main{padding:8px}}
  </style>
</head>
<body>
  <header><div class="brand">Truck<span>Pak</span></div><a href="./#demo">← Wróć do strony projektu</a></header>
  <main>
    <div class="frame">
      <iframe src="https://appetize.io/embed/b_vkb643xtqoppffkj7t4wkkga3a?centered=both&amp;scale=auto&amp;codec=jpeg" title="TruckPak — interaktywne demo Android" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen" allowfullscreen></iframe>
    </div>
  </main>
</body>
</html>
